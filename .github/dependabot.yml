version: 2

# npm and Cargo land in one PR: one CI run instead of two (plus a rerun of whichever
# merges second), and the Tauri npm packages and crates always move together. A Cargo
# bump merged ahead of its npm counterpart once broke release builds with
# "Found version mismatched Tauri packages".
multi-ecosystem-groups:
  app-deps:
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: app-deps
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    multi-ecosystem-group: app-deps
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
